<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICHIRU 美山デモ</title><style>
:root{
  --bg:#f5f2ea;--paper:#fffdf8;--ink:#1e2520;--muted:#687069;--green:#2f5c45;
  --green2:#dfeadf;--green3:#eef5ee;--gold:#a8752d;--line:#ddd8cf;--red:#9b4b3f;
  --blue:#385c7a;--shadow:0 12px 38px rgba(37,48,40,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(245,242,234,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.container{max-width:1160px;margin:auto;padding:0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:14px}
.brand{font-weight:900;letter-spacing:.12em;font-size:22px}
.brand small{font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--muted);display:block}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a,.navbtn{padding:9px 12px;border-radius:11px;text-decoration:none;font-size:13px;border:1px solid transparent}
nav a:hover,.navbtn:hover{background:var(--paper);border-color:var(--line)}
main{padding:28px 0 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.eyebrow{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.08em}
h1{font-size:clamp(35px,5.6vw,68px);line-height:1.02;margin:10px 0 16px;letter-spacing:-.04em}
h2{font-size:28px;margin:0 0 14px;letter-spacing:-.02em}
h3{font-size:18px;margin:0 0 8px}
p{line-height:1.75;color:var(--muted);margin:8px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button,.button{appearance:none;border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.ghost{background:#ece7de;color:var(--ink)}
section{margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--green3);font-size:11px;margin:3px 3px 0 0}
.pill.gold{background:#f7eddc;color:#77511d}.pill.blue{background:#e8eff4;color:var(--blue)}.pill.red{background:#f7e8e5;color:var(--red)}
.choice{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left;cursor:pointer}
.choice.active{outline:2px solid var(--green);background:#f0f6f0}
label{font-size:12px;font-weight:800;display:block;margin:12px 0 6px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}
.step{display:none}.step.active{display:block}
.rec{border:1px solid var(--line);border-radius:17px;padding:16px;background:white;margin-top:10px}
.rec .title{font-weight:900;font-size:19px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.route{position:relative;margin-top:10px}
.route:before{content:"";position:absolute;left:15px;top:22px;bottom:22px;width:2px;background:var(--green2)}
.stop{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;position:relative}
.num{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:#f2f5f1;border-radius:16px;padding:14px}
.kpi b{display:block;font-size:24px}.kpi span{font-size:11px;color:var(--muted)}
.notice{background:#fff5e8;color:#74501f;border:1px solid #eed6b1;padding:12px;border-radius:13px;font-size:12px;line-height:1.6}
.sourcebox{font-size:12px;background:#f3f1ec;border-radius:14px;padding:13px;margin-top:12px}
.sourcebox a{word-break:break-all}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.bar{height:10px;background:#e9e5dd;border-radius:999px;overflow:hidden;margin-top:6px}.bar>i{height:100%;display:block;background:var(--green);border-radius:999px}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--green2);color:var(--green);font-size:11px;font-weight:800}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.small{font-size:11px;color:var(--muted)}
footer{padding:28px 0 50px;color:var(--muted);font-size:12px}
@media(max-width:820px){.hero,.grid2,.split{grid-template-columns:1fr}.grid3,.grid4,.kpis{grid-template-columns:1fr 1fr}nav{display:none}}
@media(max-width:520px){.grid3,.grid4,.kpis{grid-template-columns:1fr}h1{font-size:42px}}
</style></head><body><main class="container">
<section class="card" style="margin-top:40px"><div class="eyebrow">HACKATHON DEMO</div><h1 style="font-size:52px">MICHIRU — 美山モデル</h1><p>観光客の「やりたい」と、地域の「残したい・来てほしい」をAIでつなぐ二面型プラットフォーム。</p>
<div class="grid2" style="margin-top:18px">

<a class="card" style="text-decoration:none" href="MICHIRU_Miyama_Local.html"><div class="eyebrow">LOCAL / DMO</div><h2>地域運営側サイト</h2><p>地域資源・保存ニーズを登録し、需要とのマッチング、RESAS風分析、KPI接続を確認。</p><span class="button primary">開く →</span></a>
</div></section></main></body></html>
